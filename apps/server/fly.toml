app = "callo-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  [build.args]

[env]
  NODE_ENV = "production"
  SERVER_PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
